services:
  - type: web
    name: vera-magicpin-bot
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /v1/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: TEAM_NAME
        sync: false
      - key: TEAM_MEMBERS
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: MODEL_NAME
        value: deterministic-composer-v1
      - key: APP_VERSION
        value: 1.2.0
